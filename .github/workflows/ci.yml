name: CI
on: [push, pull_request]
jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyxform openpyxl
      - run: python scripts/build_xlsform.py
      - run: python scripts/validate_form.py
      - uses: actions/upload-artifact@v4
        with:
          name: xlsform-output
          path: |
            form/FEDI_Baseline_v1.xml
            form/validation_result.txt
